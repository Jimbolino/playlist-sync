name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/requirements.txt
      - run: npm ci
      - run: pip install -r python/requirements.txt
      - name: Type-check
        run: npx tsc --noEmit
      - name: Smoke test (migrations, insert, Python read-back)
        run: |
          npx tsx scripts/smoke.ts data/smoke.db
          python python/smoke_test.py data/smoke.db

  # Dependabot PRs are squash-merged as soon as the check above passes.
  automerge:
    needs: check
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
